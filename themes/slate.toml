# Slate — for working after dark.
# Cool near-black with a muted teal primary and amber for citation markers.
# Softer corners than Rayar; the panels do more work than the rules.

[theme]
base = "dark"

primaryColor            = "#6FC3B0"
backgroundColor         = "#12151A"
secondaryBackgroundColor = "#1B1F26"
textColor               = "#E4E2DF"
linkColor               = "#8FD4C3"
borderColor             = "#2C3138"

font        = "'Source Sans 3':https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
headingFont = "'Instrument Serif':https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
codeFont    = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"

baseFontSize      = 16
headingFontSizes  = ["2rem", "1.5rem", "1.2rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [400, 400, 400, 500, 500, 500]

baseRadius   = "small"
buttonRadius = "small"
showWidgetBorder = true
linkUnderline    = false
